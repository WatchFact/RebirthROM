name: Compile RebirthROM S10+

on:
  push:
    branches: [sixteen-qpr2]
    paths:
      - .github/workflows/compile-s10.yml
      - scripts/**
      - external/**
      - prebuilts/samsung/**
      - security/**
      - target/beyond2lte/**
      - platform/exynos9820/**
      - unica/**
      - buildenv.sh
      - .gitmodules
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: s10-plus-compile-sixteen-qpr2
  cancel-in-progress: true

jobs:
  compile-beyond2lte:
    name: Compile Galaxy S10+ (beyond2lte)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      DEBIAN_FRONTEND: noninteractive
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Xmx3g"
      JAVA_TOOL_OPTIONS: "-Xmx3g"

    steps:
      - name: Checkout source and required tool submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Make room for firmware extraction
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune --all --force || true
          sudo docker builder prune --all --force || true
          df -h /

      - name: Set up Java 17 and dependencies
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            p7zip-full jq attr ccache clang cmake ffmpeg golang \
            libbrotli-dev libbz2-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev lld protobuf-compiler webp curl xxd patchelf flex bison \
            libarchive-tools build-essential pcre2-utils libssl-dev \
            python3 python3-pip zstd lz4
          free -h
          df -h /

      - name: Configure Git identity for toolchain patches
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test -n "$(git config --global user.name)"
          test -n "$(git config --global user.email)"
          echo "Git committer configured for Android-tools patch application."

      - name: Build Android image and APK tooling
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/build_dependencies.sh
          df -h /

      - name: Download and extract Android 16 source firmware
        shell: bash
        run: |
          # The upstream buildenv uses optional unset variables; do not use nounset.
          set -eo pipefail
          source ./buildenv.sh beyond2lte
          ./scripts/download_fw.sh --force --ignore-target
          ./scripts/extract_fw.sh --force --ignore-target
          SOURCE_DIR="$(cut -d/ -f1 <<< "$SOURCE_FIRMWARE")_$(cut -d/ -f2 <<< "$SOURCE_FIRMWARE")"
          if [[ -f "$FW_DIR/$SOURCE_DIR/.extracted" ]]; then
            rm -rf "$ODIN_DIR/$SOURCE_DIR"
          fi
          df -h /

      - name: Download and extract Galaxy S10+ target firmware
        shell: bash
        run: |
          # The upstream buildenv uses optional unset variables; do not use nounset.
          set -eo pipefail
          source ./buildenv.sh beyond2lte
          ./scripts/download_fw.sh --force --ignore-source
          ./scripts/extract_fw.sh --force --ignore-source
          TARGET_DIR="$(cut -d/ -f1 <<< "$TARGET_FIRMWARE")_$(cut -d/ -f2 <<< "$TARGET_FIRMWARE")"
          if [[ -f "$FW_DIR/$TARGET_DIR/.extracted" ]]; then
            rm -rf "$ODIN_DIR/$TARGET_DIR"
          fi
          df -h /

      - name: Compile the S10+ ROM work directory
        shell: bash
        run: |
          # The upstream buildenv uses optional unset variables; do not use nounset.
          set -eo pipefail
          source ./buildenv.sh beyond2lte
          bash ./scripts/make_rom.sh --force --no-rom-zip
          test -s "$WORK_DIR/.completed"
          test -s "$WORK_DIR/system/system/build.prop"
          test -s "$WORK_DIR/vendor/build.prop"
          echo "COMPILED_WORK_DIR=$WORK_DIR" >> "$GITHUB_ENV"
          df -h /

      - name: Record compilation evidence
        if: always()
        shell: bash
        run: |
          mkdir -p compile-report
          {
            echo "Commit: $GITHUB_SHA"
            echo "Target: SM-G975F / beyond2lte"
            echo "Job result: ${{ job.status }}"
            echo "Disk:"
            df -h /
            echo "Completed work-dir marker:"
            test -s out/target/beyond2lte/work_dir/.completed && echo yes || echo no
          } > compile-report/result.txt
          find out/target/beyond2lte -maxdepth 1 -name '*.log' -type f \
            -exec cp {} compile-report/ \; 2>/dev/null || true
          # Preserve the exact thermal-policy/parser evidence after an abort.
          python3 scripts/collect_s10_thermal_evidence.py out compile-report/thermal
          # When the donor SamsungCamera patch rejects its smali hunks,
          # capture only bounded class/method excerpts for an exact rebase.
          # Do not silently skip the incompatible compatibility patch.
          CAMERA_APK=out/target/beyond2lte/apktool/system/priv-app/SamsungCamera/SamsungCamera.apk
          if [[ ! -s out/target/beyond2lte/work_dir/.completed && -d "$CAMERA_APK" ]]; then
            python3 scripts/collect_s10_camera_evidence.py "$CAMERA_APK" compile-report/camera/donor-smali-excerpts.txt
          fi
          # Preserve bounded Android 16 donor evidence for the legacy face
          # HIDL 2.0 patch; never bypass or guess incompatible bytecode.
          FACE_JAR=out/target/beyond2lte/apktool/system/framework/services.jar
          FACE_PATCH=unica/patches/legacy/face/services.jar/0001-Fallback-to-Face-HIDL-2.0.patch
          if [[ ! -s out/target/beyond2lte/work_dir/.completed && -d "$FACE_JAR" ]]; then
            python3 scripts/collect_s10_face_evidence.py "$FACE_JAR" "$FACE_PATCH" compile-report/face/donor-smali-excerpts.txt --full-classes
          fi
          # If the Android 16 Settings APK patch cannot be applied, preserve
          # the real dex-directory locations and feature references, not
          # proprietary donor bytecode or speculative class names.
          if [[ ! -s out/target/beyond2lte/work_dir/.completed ]]; then
            mkdir -p compile-report/vibration-settings
            for APK_NAME in SecSettings SettingsProvider; do
              APK_DIR="out/target/beyond2lte/apktool/system/priv-app/$APK_NAME/$APK_NAME.apk"
              if [[ -d "$APK_DIR" ]]; then
                {
                  echo "Decoded APK: $APK_NAME"
                  echo "Classes matching legacy virtual-vibration patch:"
                  find "$APK_DIR" -type f \( -name '*VirtualVibration*.smali' -o -name 'SoundSettings$3.smali' -o -name 'ResetSoundSystemFeedbackSettings$1.smali' -o -name 'SoundItem.smali' -o -name 'DatabaseHelper$1.smali' \) -printf '%P\n' | sort
                  echo "Files referencing virtual-vibration feature:"
                  grep -RIl --include='*.smali' -E 'vibration_sound_enabled|VirtualVibrationSound|VibrationSoundEnabled' "$APK_DIR" | sed "s#^$APK_DIR/##" | sort || true
                } > "compile-report/vibration-settings/$APK_NAME-inventory.txt"
                # Capture full donor classes only in the private CI diagnostic
                # artifact. This is evidence for a guarded Android 16 rebase,
                # not a partial patch or a change to the device image.
                SETTINGS_VIB_PATCH="unica/patches/product_feature/audio/virtual_vib/$APK_NAME.apk/0001-Disable-virtual-vibration-support.patch"
                if [[ -f "$SETTINGS_VIB_PATCH" ]]; then
                  if ! python3 scripts/collect_s10_settings_vib_evidence.py \
                      "$APK_DIR" "$SETTINGS_VIB_PATCH" \
                      "compile-report/vibration-settings/$APK_NAME-donor-smali.txt"; then
                    echo "::warning::Complete $APK_NAME virtual-vibration donor evidence unavailable"
                  fi
                fi
              fi
            done
          fi

          # The Android 16 donor's MobileAP 11ax patch rejected three real
          # semwifi-service.jar smali hunks in compilation #80. Preserve the
          # complete affected donor classes for a controlled compatibility
          # rebase. Do not bypass the hotspot capability patch or assume
          # that S10+ supports Wi-Fi 6 hotspot mode.
          WIFI_JAR=out/target/beyond2lte/apktool/system/framework/semwifi-service.jar
          WIFI_11AX_PATCH=unica/patches/product_feature/wifi/80211ax/semwifi-service.jar/0001-Disable-MOBILEAP_11AX-support.patch
          if [[ ! -s out/target/beyond2lte/work_dir/.completed && -d "$WIFI_JAR" ]]; then
            if ! python3 scripts/collect_s10_settings_vib_evidence.py \
                "$WIFI_JAR" "$WIFI_11AX_PATCH" \
                compile-report/wifi/semwifi-11ax-donor-smali.txt; then
              echo "::warning::Complete Android 16 MobileAP 11ax donor evidence unavailable"
            fi
          fi

          # Virtual-vibration disablement currently fails on donor-specific
          # audio/vibrator smali. Capture complete donor classes for a safe
          # behavior-preserving rebase; never apply partial patch hunks.
          VIB_PATCH=unica/patches/product_feature/audio/virtual_vib/services.jar/0001-Disable-virtual-vibration-support.patch
          if [[ ! -s out/target/beyond2lte/work_dir/.completed && -d "$FACE_JAR" ]]; then
            if ! python3 scripts/collect_s10_virtual_vib_evidence.py "$FACE_JAR" "$VIB_PATCH" compile-report/vibration/donor-smali-excerpts.txt --full-classes; then
              echo "::warning::Virtual-vibration donor evidence capture failed"
            fi
          fi



          # The Android 16 legacy SehLights patch can reject donor-specific
          # LightsService/PowerManagerUtil bytecode. Preserve complete classes
          # for a controlled rebase, not partial hunks or a skipped patch.
          LIGHTS_PATCH=unica/patches/legacy/lights/services.jar/0001-Backport-legacy-SehLights-HAL-code.patch
          if [[ ! -s out/target/beyond2lte/work_dir/.completed && -d "$FACE_JAR" ]]; then
            if ! python3 scripts/collect_s10_legacy_lights_evidence.py "$FACE_JAR" "$LIGHTS_PATCH" compile-report/legacy-lights/donor-smali-complete.txt; then
              echo "::warning::Complete legacy SehLights donor evidence capture failed"
            fi
          fi

          # Record actual stock and patched light HAL init/VINTF wiring.
          # The S21 donor binary alone is not proof that Android can start it.
          python3 scripts/collect_s10_light_hal_evidence.py \
            compile-report/light-hal/evidence.json \
            out/fw/SM-G975F_AUT out/target/beyond2lte/work_dir

      - name: Upload compilation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s10-plus-compilation-report
          path: compile-report
          retention-days: 7
          if-no-files-found: warn

name: Verify S10 source layout

on:
  push:
    branches:
      - sixteen-qpr2
  pull_request:
  workflow_dispatch:

jobs:
  verify_s10_sources:
    name: Validate S10-only source tree
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify targets and platform
        shell: bash
        run: |
          set -euo pipefail
          expected=(beyond0lte beyond1lte beyond2lte beyondx)
          mapfile -t actual < <(find target -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected target folders: %s\n' "${actual[*]}" >&2
            exit 1
          fi
          test -d platform/exynos9820
          test ! -d platform/exynos990
          test ! -d prebuilts/samsung/c1sxxx
          test ! -d prebuilts/samsung/c2sxxx
          for device in "${expected[@]}"; do
            test -f "target/$device/config.sh"
            grep -q 'TARGET_PLATFORM="exynos9820"' "target/$device/config.sh"
          done
          echo 'All S10 legacy source targets are present.'
          echo '::warning::S10 build/flash workflow is not yet enabled: configuration ABI, static partition installer, boot images, and device integration require porting and validation.'
